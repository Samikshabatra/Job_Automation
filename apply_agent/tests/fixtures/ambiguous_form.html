<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply - Custom Screening Questions</title>
</head>
<body>
  <main>
    <h1>Custom Screening Questions</h1>
    <form id="application_form" action="#" method="post">
      <section class="application-question">
        <label for="q_custom">Why do you want this role?</label>
        <textarea name="q_custom" id="q_custom" aria-label="Why do you want this role?" required></textarea>
      </section>

      <section class="application-question">
        <label for="q_salary">Desired compensation</label>
        <input type="text" name="q_salary" id="q_salary" aria-label="Desired compensation" required>
      </section>

      <section class="application-question">
        <label for="q_start">Earliest start date</label>
        <input type="text" name="q_start" id="q_start" aria-label="Earliest start date">
      </section>

      <section class="application-question">
        <label for="q_referral">How did you hear about us?</label>
        <input type="text" name="q_referral" id="q_referral" aria-label="How did you hear about us?">
      </section>

      <button type="submit">Submit Application</button>
    </form>
  </main>
</body>
</html>

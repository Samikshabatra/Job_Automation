<!doctype html>
<html>
  <head><title>Apply</title></head>
  <body>
    <!--
      A client-rendered application form, the shape Ashby and modern Greenhouse
      postings actually ship. At DOMContentLoaded this document contains no
      fields at all; they appear only after the app mounts.

      The 600ms delay stands in for that mount. An agent that reads the DOM at
      domcontentloaded sees an empty page and concludes the posting has no form.
    -->
    <div id="root"></div>
    <script>
      setTimeout(function () {
        document.getElementById('root').innerHTML =
          '<form>' +
          '<input name="first_name" type="text" />' +
          '<input name="last_name" type="text" />' +
          '<input name="email" type="email" />' +
          '<textarea name="cover_letter"></textarea>' +
          '</form>';
      }, 600);
    </script>
  </body>
</html>

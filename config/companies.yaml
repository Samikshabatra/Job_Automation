#     token: gamma
#
# Every entry below has an EXPLICIT ats + token that was probed against the
# live board and confirmed to belong to the right employer. Pinning them means
# the resolver never guesses at runtime: `resolveAll` upserts a pinned entry
# directly, skipping the slug probe entirely.
#
# Why that matters — three names resolved to the WRONG company's board during
# the probe, because the slug generator falls back to the first word:
#   Tiger Analytics -> ashby/tiger  (4 jobs, San Francisco only — not the
#                                    Indian analytics firm)
#   Navi            -> ashby/navi   (8 jobs, San Francisco, "Founding
#                                    Engineer" roles — not the fintech)
#   Slice           -> greenhouse/slice (43 jobs, New Jersey / Skopje /
#                                    Mexico — the US pizza-tech Slice)
# A wrong-but-live board means applying to an employer you never chose, so
# never enable an entry you have not opened in a browser yourself.


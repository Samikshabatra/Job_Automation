titles:
  include: [ai engineer, ai automation engineer, ml engineer, machine learning engineer,
             data analyst, data engineer, data scientist, analytics engineer,
             applied scientist, nlp engineer, mlops engineer]
  exclude: [senior,principal,director]
experience:
  max_years_required: 4         # loosened from 2; JD MINIMUM stated years above this is rejected
                                # "0-4 years" ranges pass, "5+ years" does not
locations:
  include: [bengaluru,delhi, gurugram, noida, remote]
freshness:
  max_posted_age_days: 60       # older postings are never applied to;
                                # liveness check confirms the posting is still open before submit
  verify_open_before_submit: true
scoring:
  threshold: 0                  # apply regardless of skill-match score; location/title/experience still gate
limits:
  daily_cap: 30
  per_company_open_applications: 3
  min_delay_seconds: 45
  max_delay_seconds: 120
submission:
  dry_run: true                 # back to safe: ATS submit adapters return HTTP 400 (not yet live-validated)
  browser_enabled: false        # kill switch for live browser-driven submission
  confidence_threshold: 0.85    # minimum field-mapping confidence required before submit
optimizer:
  max_repair_attempts: 3        # resume-optimizer re-tailors a fabrication-failed job this many times

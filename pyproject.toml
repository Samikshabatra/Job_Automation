[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "playwright",
    "google-generativeai",
    "pyyaml",
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
packages = ["apply_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

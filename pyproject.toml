[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "playwright>=1.62",
    "google-generativeai>=0.8",
    "pyyaml>=6.0",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.setuptools]
packages = ["apply_agent", "resume_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apply_agent/tests", "resume_agent/tests"]
